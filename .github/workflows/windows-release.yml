name: Windows release
on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: platforms/windows
  package:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platforms/windows/package-lock.json
      - run: npm ci
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-package.cjs
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip' }
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content dist/SHA256SUMS -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Sourcify-Windows
          path: |
            platforms/windows/dist/*.exe
            platforms/windows/dist/*.zip
            platforms/windows/dist/SHA256SUMS
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.zip dist/SHA256SUMS --title "Sourcify Windows ${GITHUB_REF_NAME#windows-v}" --notes-file release-notes.txt
