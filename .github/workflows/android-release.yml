name: Verify existing update signing key

on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check existing update key without exporting it
        env:
          SIGNING_KEY: ${{ secrets.SOURCIFY_SIGNING_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo 'UPDATE_SIGNING_KEY_NOT_CONFIGURED'
            exit 1
          fi
          umask 077
          keyfile="$RUNNER_TEMP/update-signing-check.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keyfile"
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          if [ "$actual" != '213034870b96e6cd98d1b56225e668c5f81f1b198f3f4b4a28d4f686481f844e' ]; then
            echo 'UPDATE_SIGNING_CERTIFICATE_MISMATCH'
            exit 1
          fi
          echo 'EXISTING_UPDATE_SIGNING_KEY_CONFIRMED'
